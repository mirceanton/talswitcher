---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test
permissions: { contents: read }

on:
  workflow_dispatch: {}
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/test.yaml"
      - scripts/test.sh
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".mise.toml"
      - "mise.lock"
  # Renovate automerges minor/patch bumps by pushing a branch and fast-forwarding
  # main (no PR), so the pull_request trigger above never fires for them. Run the
  # e2e test on those branches too so a bump that breaks it gets caught.
  push:
    branches: ["renovate/**"]
    paths:
      - ".github/workflows/test.yaml"
      - scripts/test.sh
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".mise.toml"
      - "mise.lock"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - name: Run Tests
        run: bash scripts/test.sh
